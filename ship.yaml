# The gate (ship check, and ship pre-push in the hook) and the release, see github.com/trick77/ship.
# A Go module: go get resolves only v-prefixed semver tags.
tag_prefix: v
visibility: public
allow:
  - rule: scaffold
    path: .github/workflows/release.yaml
    why: a merged Dependabot go.mod/go.sum bump releases by itself (public repo, free minutes); by hand otherwise
